<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - 飞创维度</title>
    <style>
        :root {
            --primary-color: #2a2a2a;
            --secondary-color: #3a3a3a;
            --accent-color: #4285f4;
            --text-color: #ffffff;
            --border-color: #555555;
            --panel-bg: #333333;
            --main-bg: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--main-bg), var(--primary-color));
            color: var(--text-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .register-container {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background-color: rgba(51, 51, 51, 0.8);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 1.8rem;
            color: var(--accent-color);
            margin-bottom: 10px;
        }

        .logo p {
            color: #aaa;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #ddd;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background-color: #444;
            color: white;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 1rem;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(66, 133, 244, 0.5);
        }

        .register-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 10px;
        }

        .register-btn:hover {
            background-color: #3b77db;
        }

        .register-btn:disabled {
            background-color: #666;
            cursor: not-allowed;
        }

        .links {
            display: flex;
            justify-content: center;
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .links a {
            color: var(--accent-color);
            text-decoration: none;
            margin: 0 10px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ff6b6b;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }

        .success-message {
            color: #4caf50;
            margin-top: 10px;
            text-align: center;
            min-height: 20px;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <h1><i class="fas fa-cube"></i> 飞创维度</h1>
            <p>连续纤维增强3D打印工艺平台</p>
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="reg-username">用户名</label>
                <input type="text" id="reg-username" name="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group">
                <label for="reg-email">邮箱</label>
                <input type="email" id="reg-email" name="email" placeholder="请输入邮箱地址" required>
            </div>
            
            <div class="form-group">
                <label for="reg-password">密码</label>
                <input type="password" id="reg-password" name="password" placeholder="请输入密码" required>
            </div>
            
            <div class="form-group">
                <label for="reg-confirm-password">确认密码</label>
                <input type="password" id="reg-confirm-password" name="confirm-password" placeholder="请再次输入密码" required>
            </div>
            
            <button type="submit" class="register-btn" id="registerButton">
                <span id="registerButtonText">注册</span>
                <span id="registerSpinner" class="loading" style="display: none;"></span>
            </button>
        </form>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <div class="links">
            <a href="/login"><i class="fas fa-sign-in-alt"></i> 已有账号？立即登录</a>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const registerButton = document.getElementById('registerButton');
            const registerButtonText = document.getElementById('registerButtonText');
            const registerSpinner = document.getElementById('registerSpinner');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // 验证密码是否一致
            if (password !== confirmPassword) {
                errorMessage.textContent = '两次输入的密码不一致';
                return;
            }
            
            // 验证密码长度
            if (password.length < 6) {
                errorMessage.textContent = '密码长度至少为6位';
                return;
            }
            
            // 显示加载状态
            registerButton.disabled = true;
            registerButtonText.style.display = 'none';
            registerSpinner.style.display = 'inline-block';
            errorMessage.textContent = '';
            successMessage.textContent = '';
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        username, 
                        email, 
                        password 
                    })
                });
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    successMessage.textContent = data.message;
                    // 清空表单
                    document.getElementById('registerForm').reset();
                    // 3秒后跳转到登录页
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    errorMessage.textContent = data.message;
                }
            } catch (error) {
                errorMessage.textContent = '注册请求失败: ' + error.message;
            } finally {
                // 恢复按钮状态
                registerButton.disabled = false;
                registerButtonText.style.display = 'inline';
                registerSpinner.style.display = 'none';
            }
        });
    </script>
</body>
</html>
