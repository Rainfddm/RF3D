[project]
name = "rf3d"
version = "0.1.0"
description = "RF3D 连续纤维增强 3D 打印系统"
requires-python = ">=3.10"
dependencies = [
    "Flask==2.3.3",
    "Flask-SQLAlchemy==3.0.5",
    "Flask-Migrate==4.1.0",
    "Werkzeug==2.3.7",
    "numpy==1.26.4",
    "scipy==1.15.2",
    "vtk==9.4.1",
    "matplotlib==3.7.4",
    "scikit-learn==1.3.2",
    "psutil==5.9.0",
    "pyserial==3.5",
    "pyclipper==1.3.0.post5",
    "shapely==2.0.2",
    "requests==2.32.0",
    "openai>=1.0,<2.0",
]

[project.optional-dependencies]
desktop = [
    "PyQt5==5.15.10",
    # 桌面端路径优化器（suFabEngine/PathOptimizer/PathOptimizer.py:2）在模块级
    # import torch。引擎核心（Pipeline / pipeline_executor / suGCoder / ai_agent）
    # 已不依赖 torch（该解耦结论在源仓库的完整测试中验证）。
    "torch==2.1.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "flake8>=6.0",
    "black>=23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.coverage.run]
source = ["application", "suFabEngine", "suFabUI"]
omit = [
    "*/__pycache__/*",
    "*/test_*.py",
    # 自动生成的 Qt UI / 资源代码
    "suFabUI/src/suFabUI/core/resource_rc.py",
    "suFabUI/src/suFabUI/core/ui_*.py",
    "suFabUI/src/suFabUI/ui/*",
    # PyQt5 渲染层（依赖 GUI 环境，无法 headless 单测）
    "suFabUI/src/suFabUI/core/suView.py",
    "suFabUI/src/suFabUI/core/controller.py",
    "suFabUI/src/suFabUI/core/AiTerminal.py",
    "suFabUI/src/suFabUI/core/VTKViewer.py",
    "suFabUI/src/suFabUI/core/VTKSceneTreeWidget.py",
    "suFabUI/src/suFabUI/core/dlg_printer_setting.py",
    "suFabUI/src/suFabUI/core/class_base.py",
    "suFabUI/src/suFabUI/main.py",
    # CUDA / vtk 渲染 / 可视化（依赖硬件或 GUI）
    "suFabEngine/src/suFabEngine/PathOptimizer/VtkAdaptor.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
