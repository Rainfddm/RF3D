[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rf3d-engine"
version = "0.1.0"
description = "RF3D 连续纤维增强 3D 打印引擎：STL 加载 → 切片 → 费马螺旋路径生成 → GCode 输出"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "朱雨豪" },
]
keywords = ["3d-printing", "gcode", "slicer", "fiber-reinforced", "fermat-spiral", "path-planning"]
license = "LicenseRef-Proprietary"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Manufacturing",
]
dependencies = [
    "numpy>=1.26",
    "vtk>=9.0",
    "scipy>=1.11",
    "pyclipper>=1.3",
    "matplotlib>=3.7",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "opencv-python>=4.8",
    "openai>=1.0",
    "tqdm>=4.65",
    "psutil>=5.9",
    "pyserial>=3.5",
]

[project.optional-dependencies]
# 文档读取工具（suAgent/tools/doc_reader.py 用到，按需安装）
docs = [
    "pypdf>=3.0",
    "python-docx>=1.1",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["suFabEngine*", "suAgent*"]
